[package]
name = "falcon-shake-signer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Falcon-512 signer for the falcon-shake-starknet accounts, built on PQClean"

[[bin]]
name = "falcon-signer"
path = "src/main.rs"

[dependencies]
pqcrypto-falcon = "=0.4.1"
pqcrypto-traits = "0.3"
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
